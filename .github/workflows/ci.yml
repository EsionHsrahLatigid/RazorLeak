name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_heavy:
        description: Run the macOS and Windows build jobs regardless of changed paths
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: EsionHsrahLatigid/yup-actions/.github/workflows/plugin-ci.yml@d7746cba582c0a00e6e7f0cdc37ae3b2d38830d8
    with:
      product_name: RazorLeak
      product_slug: razorleak
      cmake_option_prefix: RAZORLEAK
      debug_targets_json: '["razorleak_engine_tests","razorleak_hosted_compile_tests","razorleak_standalone_plugin","razorleak_vst3_plugin"]'
      release_test_targets_json: '["razorleak_engine_tests","razorleak_hosted_compile_tests"]'
      windows_debug_plugins: true
